services:
  backend:
    image: demand-planner-backend
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: demand-planner-backend
    env_file:
      - backend/.env
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    image: demand-planner-frontend
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: demand-planner-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
